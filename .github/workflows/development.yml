name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

# 并发控制：同一分支/PR 新的推送会取消仍在排队或运行的旧构建。
# 这能显著缓解 macos-14 runner 供应紧张导致的"一直卡在队列中"问题：
# 开发中频繁 push 时，旧构建被立即取消，runner 资源让给最新提交。
# workflow_dispatch 手动触发也纳入同一组，避免与自动触发互相堆积。
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-latest

    steps:
      - name: Select Xcode 15.4
        run: |
          set -e
          echo "Available apps in /Applications (matching Xcode*):"
          ls /Applications | grep -E "Xcode(.+)?\.app" || true
          # Pick the latest Xcode available on the runner
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting latest: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "Selecting /Applications/Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            echo "No preinstalled Xcode found. Leaving system default."
          fi
          xcodebuild -version || true

      - name: Install GNU Make
        run: |
          brew update
          brew install make

      - name: Install Java 8 (Temurin) via Homebrew
        run: |
          brew install --cask temurin@8 || true

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove stale MobileGL gitlink
        # MobileGL submodule 已完整移除（.gitmodules 中无对应条目），
        # 但并行 agent 操作或本地 index 残留可能反复引入孤立 gitlink，
        # 导致后续 git submodule update --init 因找不到 URL 而 exit 128。
        # checkout 后、submodule 初始化前强制清理。
        # MobileGlues submodule 同样已移除（源码直接内嵌仓库，对齐 Ynnyny）。
        run: |
          git rm --cached -f Natives/external/MobileGL 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGL 2>/dev/null || true
          git rm --cached -f Natives/external/MobileGlues 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGlues 2>/dev/null || true

      - name: Checkout repository submodules
        env:
          # MobileGL 上游 LFS 配额已用尽，其 LFS 文件（tools/trace_replay/fixtures）
          # 与 iOS 构建无关，跳过 smudge 避免 submodule checkout 失败 exit 128
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git submodule update --init --recursive

      - name: Download MobileGlues prebuilt artifact
        id: download-mg
        env:
          # 优先使用 PAT 以支持跨仓库访问；未配置时回退到默认 GITHUB_TOKEN（仅对公开仓库可能可用）
          GH_TOKEN: ${{ secrets.MG_DOWNLOAD_TOKEN || github.token }}
        run: |
          set -e
          mkdir -p mobileglues-artifact
          cd mobileglues-artifact

          # 动态查询 MobileGL-Dev/MobileGlues 最近成功的 workflow run，避免硬编码
          # run ID（artifact 90 天后会过期，硬编码 ID 注定会失效）。
          echo "Fetching recent successful workflow runs from MobileGL-Dev/MobileGlues..."
          RUN_IDS=$(gh run list \
            --repo MobileGL-Dev/MobileGlues \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId')

          if [ -z "$RUN_IDS" ]; then
            echo "::error::No successful workflow runs found in MobileGL-Dev/MobileGlues"
            exit 1
          fi

          # 逐个尝试，直到找到仍保留 MobileGlues-iOS-dylib artifact 的 run
          DOWNLOADED=0
          for ID in $RUN_IDS; do
            echo "Trying to download 'MobileGlues-iOS-dylib' from run $ID..."
            if gh run download "$ID" \
              --repo MobileGL-Dev/MobileGlues \
              --name MobileGlues-iOS-dylib \
              --dir . ; then
              DOWNLOADED=1
              echo "downloaded_from_run=$ID" >> $GITHUB_OUTPUT
              break
            fi
            echo "Artifact not available in run $ID, trying next..."
          done

          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "::error::Failed to download MobileGlues-iOS-dylib from any recent successful run."
            exit 1
          fi

          ls -la
          echo "Artifact downloaded successfully"
      - name: Build for ${{ matrix.platform_name }}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 14.0
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=0
          
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
            
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          
          else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}.ipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        if: matrix.platform_name == 'ios' && success()
        uses: actions/upload-artifact@v4
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM